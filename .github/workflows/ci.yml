name: CI - Python import check

on:
  push:
    branches: [ dev/cafe-enhancements, master ]
  pull_request:
    branches: [ master ]

jobs:
  lint-and-import:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check (import app)
        run: |
          python -c "import sys; sys.path.insert(0, '.'); import app; print('app imported successfully')"
